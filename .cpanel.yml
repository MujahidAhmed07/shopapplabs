---
deployment:
  tasks:
    - export DEPLOYPATH=/home/aljadeedelectric/usernamechecker
    - rm -rf $DEPLOYPATH/.next
    - /bin/cp -R .next $DEPLOYPATH/
    - /bin/cp -R app $DEPLOYPATH/
    - /bin/cp -R components $DEPLOYPATH/
    - /bin/cp -R lib $DEPLOYPATH/
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp app.js $DEPLOYPATH/
    - /bin/cp server.js $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp package.json $DEPLOYPATH/
    - /bin/cp package-lock.json $DEPLOYPATH/
    - /bin/cp next.config.mjs $DEPLOYPATH/
    - /bin/cp postcss.config.js $DEPLOYPATH/
    - /bin/cp tailwind.config.js $DEPLOYPATH/
    - /bin/cp jsconfig.json $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp robots.txt $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp sitemap.xml $DEPLOYPATH/ 2>/dev/null || true
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt



