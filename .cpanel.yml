---
deployment:
  tasks:
    - export DEPLOYPATH=/home/aljadeedelectric/ucheck
    - cd $DEPLOYPATH && git reset --hard HEAD && git clean -fd 2>/dev/null || true
    - pkill -9 -f "lsnode:/home/aljadeedelectric/ucheck/" 2>/dev/null || true
    - mkdir -p $DEPLOYPATH/public/_next/static
    - /bin/cp -Rf $DEPLOYPATH/.next/static/* $DEPLOYPATH/public/_next/static/ 2>/dev/null || true
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt